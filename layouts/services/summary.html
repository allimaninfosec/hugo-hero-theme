<div class="service service-summary">
  {{ if .Params.icon }}
  <div class="service-image">
    <span style="font-size: 80px;"><i class="{{ .Params.icon }}" title="{{ .Title }}" alt="{{ .Title }}"></i></span>
  </div>
  {{ end }}
  <div class="service-content">
    <h2 class="service-title">
      {{ .Title }}
    </h2>
    {{ .Content | truncate 120 "..." }}
  </div>
</div>
